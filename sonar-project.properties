sonar.projectKey=MMarioB_qa-tech-challenge
sonar.organization=mmariob
sonar.sourceEncoding=UTF-8

# Sources
sonar.sources=.
sonar.tests=cypress

# Files to exclude
sonar.exclusions=node_modules/**/*,cypress/videos/**/*,cypress/screenshots/**/*
sonar.test.inclusions=**/*.spec.js,**/*.test.js,**/*.cy.js,**/*.feature

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Additional parameters
sonar.qualitygate.wait=true