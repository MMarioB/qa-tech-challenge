name: Cypress Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  cypress-run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '22'
        
    - name: Install dependencies
      run: yarn install
      
    - name: Run Cypress tests
      id: cypress
      run: |
        yarn cypress:run
        echo "::set-output name=totalTests::$(yarn run cypress:results | jq '.totalTests')"
        echo "::set-output name=passedTests::$(yarn run cypress:results | jq '.passedTests')"
        echo "::set-output name=failedTests::$(yarn run cypress:results | jq '.failedTests')"
      
    - name: Test Results Summary
      run: |
        echo "Total Tests: ${{ steps.cypress.outputs.totalTests }}"
        echo "Passed Tests: ${{ steps.cypress.outputs.passedTests }}"
        echo "Failed Tests: ${{ steps.cypress.outputs.failedTests }}"
      
    - uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: cypress-screenshots
        path: cypress/screenshots