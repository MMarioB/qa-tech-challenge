name: Cypress Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: yarn install
        
      - name: Run Cypress tests
        id: cypress
        run: |
          # Run tests and store output
          yarn cypress:run 2>&1 | tee cypress-output.txt
          
          # Store exit code
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          
          # Count tests results
          echo "total_tests=$(cat cypress-output.txt | grep -o 'Running:.*' | wc -l)" >> $GITHUB_OUTPUT
          echo "passed_tests=$(cat cypress-output.txt | grep -o '✓.*' | wc -l)" >> $GITHUB_OUTPUT
          echo "failed_tests=$(cat cypress-output.txt | grep -o '✖.*' | wc -l)" >> $GITHUB_OUTPUT
          
      - name: Test Results Summary
        if: always()
        run: |
          echo "📊 Test Results Summary"
          echo "------------------------"
          echo "✨ Total Tests: ${{ steps.cypress.outputs.total_tests }}"
          echo "✅ Passed Tests: ${{ steps.cypress.outputs.passed_tests }}"
          echo "❌ Failed Tests: ${{ steps.cypress.outputs.failed_tests }}"
          
      - name: Upload Screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
      
       name: Upload Cypress Output
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cypress-output
          path: cypress-output.txt