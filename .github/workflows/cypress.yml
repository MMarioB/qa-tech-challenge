name: Cypress Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  cypress-run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '22'
        
    - name: Install dependencies
      run: yarn install
      
    - name: Run Cypress tests
      id: cypress
      run: |
        yarn cypress:run
        CYPRESS_RESULTS=$(yarn cypress:run --reporter json --reporter-options "mochaFile=./cypress/results/results-[hash].json")
        echo "Cypress test results: $CYPRESS_RESULTS"
        TOTAL_TESTS=$(jq '.totalTests' ./cypress/results/results-*.json)
        PASSED_TESTS=$(jq '.passes' ./cypress/results/results-*.json)
        FAILED_TESTS=$(jq '.failures' ./cypress/results/results-*.json)
        echo "totalTests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
        echo "passedTests=$PASSED_TESTS" >> $GITHUB_OUTPUT
        echo "failedTests=$FAILED_TESTS" >> $GITHUB_OUTPUT
      
    - name: Test Results Summary
      run: |
        echo "Total Tests: ${{ steps.cypress.outputs.totalTests }}"
        echo "Passed Tests: ${{ steps.cypress.outputs.passedTests }}"
        echo "Failed Tests: ${{ steps.cypress.outputs.failedTests }}"
      
    - uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: cypress-screenshots
        path: cypress/screenshots